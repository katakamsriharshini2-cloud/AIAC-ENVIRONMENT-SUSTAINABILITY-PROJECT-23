version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecosphere_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/ecosphere.db
      - SECRET_KEY=ecosphere_super_secret_jwt_key_2026_academic_production
      - OPENAQ_API_KEY=${OPENAQ_API_KEY:-}
      - DATA_GOV_IN_API_KEY=${DATA_GOV_IN_API_KEY:-}
      - ENABLE_BACKGROUND_SCHEDULER=true
      - DEFAULT_LOCATION_NAME=Warangal
      - DEFAULT_LATITUDE=17.9689
      - DEFAULT_LONGITUDE=79.5941
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live-data/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecosphere_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
